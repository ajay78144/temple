<nav class="mobile-bottom-nav">
  <div class="bottom-nav-container">
    
    <!-- Home Tab -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="bottom-nav-item">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" class="bottom-nav-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="nav-label">Home</span>
    </a>

    <!-- Services Tab -->
    <a routerLink="/services" routerLinkActive="active" class="bottom-nav-item">
      <div class="icon-wrap">
        <img src="assets/icons/temple-shikhar.svg" class="bottom-nav-img" alt="Services" />
      </div>
      <span class="nav-label">Services</span>
    </a>

    <!-- Center Floating Temple Logo Emblem (Mobile App feel) -->
    <a routerLink="/booking" class="bottom-nav-center-action" title="Book Sacred Puja">
      <div class="center-badge-glow"></div>
      <div class="center-emblem">
        <img src="assets/icons/temple-logo.svg" alt="Sakoon Temple" class="center-brand-logo-img" />
      </div>
      <span class="center-label">Book Now</span>
    </a>

    <!-- Hindu Panchang / Calendar Tab -->
    <a routerLink="/calendar" routerLinkActive="active" class="bottom-nav-item">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" class="bottom-nav-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>

          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <span class="nav-label">Panchang</span>

    <!-- Mobile Drawer / Menu Trigger -->
    <button type="button" class="bottom-nav-item menu-trigger" (click)="onMenuClick()" aria-label="Open menu drawer">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" class="bottom-nav-svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
