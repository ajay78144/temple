<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Sacred Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sanctum Deep Gradient -->
    <linearGradient id="favSanctum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C1A53" />
      <stop offset="60%" stop-color="#241036" />
      <stop offset="100%" stop-color="#150822" />
    </linearGradient>

    <!-- Divine Glow Aura -->
    <radialGradient id="favAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Saffron Dhwaja Accent -->
    <linearGradient id="favSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Aura Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#favAura)" />

  <!-- Sanctum Medallion Base -->
  <circle cx="32" cy="32" r="28" fill="url(#favSanctum)" stroke="url(#favGold)" stroke-width="2" />
  
  <!-- Inner Sacred Beaded Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#favGold)" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.7" />

  <!-- Temple Flagpole & Dhwaja (Saffron Flag) -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M32 7 L40 10.5 L32 14 Z" fill="url(#favSaffron)" stroke="url(#favGold)" stroke-width="0.6" />
  <circle cx="32" cy="14" r="1.5" fill="url(#favGold)" />

  <!-- Sacred Calligraphic OM (ॐ) -->
  <g fill="url(#favGold)" transform="translate(0, 1)">
    <!-- Main 3 Shape -->
    <path d="M24 24.5 C21.5 24.5, 19 26.5, 19 29.5 C19 32.5, 21.5 34.5, 25 36 C20.5 37.5, 18 41.5, 18 46 C18 51, 22 55, 28.5 55 C34.5 55, 38.5 51, 38.5 45.5 C38.5 41.5, 36 38.5, 31.5 37 C34.5 35.5, 36.5 32.5, 36.5 29.5 C36.5 25.5, 32.5 22.5, 27 22.5 C25.8 22.5, 24.8 23, 24 23.5 L24 24.5 Z
             M26.5 27 C29.5 27, 32 28.5, 32 31 C32 33.5, 29.5 35, 26 35 C23.5 35, 22.5 33.5, 22.5 31 C22.5 28.5, 24.5 27, 26.5 27 Z
             M28 41 C32 41, 34 43.5, 34 46.8 C34 50.5, 31.5 52, 28 52 C23.5 52, 22 49.5, 22 46.8 C22 43.5, 24 41, 28 41 Z" />
    
    <!-- Om Right Loop / Flying Tail -->
    <path d="M32.5 36.5 C37 37, 43 38.5, 47.5 34.5 C52 30.5, 52.5 23.5, 52.5 20 C50 21, 48 23.5, 47.5 26.5 C47 29.5, 44.5 32, 40 32.5 C36.5 33, 33.5 34.2, 32.5 36.5 Z" />
    
    <!-- Chandrabindu (Crescent Moon) -->
    <path d="M42.5 19.5 C46 19.5, 49.5 21.2, 51.5 24 C50.5 22.5, 47.5 21.5, 44.5 21.5 C41.5 21.5, 38.5 22.5, 37.5 24 C39 21.2, 42.5 19.5, 42.5 19.5 Z" />
    
    <!-- Bindu (Divine Dot) -->
    <circle cx="44.5" cy="16" r="2" />
  </g>

  <!-- Sacred Diya Radiance Base Sparks -->
  <circle cx="23" cy="56" r="0.9" fill="#FDE68A" />
  <circle cx="32" cy="57" r="1.1" fill="#FFE082" />
  <circle cx="41" cy="56" r="0.9" fill="#FDE68A" />
</svg>
